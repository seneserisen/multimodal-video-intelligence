[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "multimodal-video-intelligence"
version = "0.3.0"
description = "Local-first deterministic multimodal evidence pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-socket>=0.7,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
video-intelligence = "video_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/video_intelligence"]

[tool.pytest.ini_options]
addopts = "-q --disable-socket"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["video_intelligence"]
mypy_path = "backend/src"
