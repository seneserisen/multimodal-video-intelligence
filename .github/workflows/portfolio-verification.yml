name: Portfolio verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} launcher workflow
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Verify Windows launchers
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call SETUP.bat -RequireExtension
          if errorlevel 1 exit /b %errorlevel%
          call TEST.bat
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify Linux launchers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./setup.sh --require-extension
          ./test.sh
